<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item">User: <a href="{{ user.get_absolute_url }}">{{ user.get_username }}</a></li>
    <li class="list-group-item">
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Log Out</button>
      </form>
    </li>
  {% else %}
    <li class="list-group-item"><a href="{% url 'login'%}?next={{request.path}}">Login</a></li>
  {% endif %}

  <br>

  <li class="list-group-item"><a href="{% url 'tasks:home' %}">Home</a></li>
  <li class="list-group-item"><a href="{% url 'tasks:task-list' %}">All tasks</a></li>
  <li class="list-group-item"><a href="{% url 'tasks:worker-list' %}">All workers</a></li>
  <li class="list-group-item-group-item"><a href="{% url 'tasks:position-list' %}">All positions</a></li>
  <li class="list-group-item"><a href="{% url 'tasks:task-type-list' %}">All Tasks Type</a></li>
</ul>
