{% extends "base.html" %}

{% block content %}
  <h1>Delete {{ position.name }} position?</h1>
  <form method="post">
    {% csrf_token %}
    <a href="{% url 'tasks:position-list' %}" class="btn btn-secondary">
      Cancel
    </a>
    <input type="submit" value="Yes" class="btn btn-danger">
  </form>
{% endblock %}
