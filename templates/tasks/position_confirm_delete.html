{% extends "base.html" %}

{% block title %}Delete Position - {{ position.name }}{% endblock %}

{% block content %}
  <div class="pt-2 mb-4">
    <h4 class="font-weight-bolder text-dark mb-2">Delete position "{{ position.name }}"?</h4>
    <p class="text-secondary text-sm">This action cannot be undone. Are you sure you want to delete this position?</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="d-flex align-items-center gap-2">
      <button type="submit" class="btn btn-sm bg-gradient-danger mb-0">Delete</button>
      <a href="{% url 'tasks:position-list' %}" class="btn btn-sm bg-gradient-secondary mb-0">Cancel</a>
    </div>
  </form>
{% endblock %}
