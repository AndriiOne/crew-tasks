{% extends "base.html" %}

{% block content %}
  <h4 class="mb-4">Delete position "{{ position.name }}"?</h4>

  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger mb-0">Delete</button>
      <a href="{% url 'tasks:position-list' %}" class="btn btn-secondary mb-0">Cancel</a>
    </div>
  </form>
{% endblock %}
