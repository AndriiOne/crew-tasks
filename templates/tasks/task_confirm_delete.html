{% extends "base.html" %}

{% block content %}
  <h1>Delete {{ task.name }} task?</h1>
  <form method="post">
    {% csrf_token %}
    <a href="{% url 'tasks:task-detail' task.id %}" class="btn btn-secondary">
      Cancel
    </a>
    <input type="submit" value="Yes" class="btn btn-danger">
  </form>
{% endblock %}
