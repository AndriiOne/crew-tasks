{% extends "base.html" %}

{% block content %}
  <h4 class="mb-4">Delete worker "{{ worker.first_name }} {{ worker.last_name }} ({{ worker.username }})"?</h4>

  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger mb-0">Delete</button>
      <a href="{% url 'tasks:worker-detail' pk=worker.id %}" class="btn btn-secondary mb-0">Cancel</a>
    </div>
  </form>
{% endblock %}
