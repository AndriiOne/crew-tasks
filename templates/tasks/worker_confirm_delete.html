{% extends "base.html" %}

{% block content %}
  <h1>Delete {{ worker.first_name }} {{ worker.last_name }} ({{ worker.username }}) worker?</h1>
  <form method="post">
    {% csrf_token %}
    <a href="{% url 'tasks:worker-detail' worker.id %}" class="btn btn-secondary">
      Cancel
    </a>
    <input type="submit" value="Yes" class="btn btn-danger">
  </form>
{% endblock %}
